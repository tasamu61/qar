<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Vue 蜈･髢繝・Δ</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app">
    <h2>{{ message }}</h2>

    <input v-model="userInput" placeholder="蜈･蜉帙＠縺ｦ縺上□縺輔＞" />
    <p>縺ゅ↑縺溘・蜈･蜉・ {{ userInput }}</p>

    <button @click="reverseText">譁・ｭ励ｒ騾・↓縺吶ｋ</button>
    <p>騾・↓縺励◆譁・ｭ・ {{ reversed }}</p>
  </div>
gi
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          message: "縺薙ｓ縺ｫ縺｡縺ｯ縲〃ue縺ｮ荳也阜・・,
          userInput: ""
        };
      },
      computed: {
        reversed() {
          return this.userInput.split("").reverse().join("");
        }
      },
      methods: {
        reverseText() {
          alert(`騾・枚蟄・ ${this.reversed}`);
        }
      }
    }).mount("#app");
  </script>
</body>
</html>
